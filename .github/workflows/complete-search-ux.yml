name: Complete search UX

on:
  push:
    paths:
      - '.github/workflows/complete-search-ux.yml'
      - '.github/scripts/patch_v014.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch userscript
        run: python .github/scripts/patch_v014.py

      - name: Verify userscript
        run: |
          node --check moba-tweaks.user.js
          grep -F '// @version      0.14.0' moba-tweaks.user.js
          grep -F "list.dataset.mobaGroupedVersion = '0.14.0';" moba-tweaks.user.js
          grep -F "classifyCompatibilityMatch" moba-tweaks.user.js
          grep -F "annotateAvailability" moba-tweaks.user.js
          grep -F "moba-tweaks-image-modal" moba-tweaks.user.js
          grep -F "event.key !== 'Backspace'" moba-tweaks.user.js
          grep -F "openSelectedProduct(event.shiftKey)" moba-tweaks.user.js

      - name: Commit changes
        run: |
          rm -f .github/workflows/complete-search-ux.yml .github/scripts/patch_v014.py
          git config user.name "goreg39"
          git config user.email "53629617+goreg39@users.noreply.github.com"
          git add moba-tweaks.user.js .github/workflows/complete-search-ux.yml .github/scripts/patch_v014.py
          git commit -m "Complete search UX improvements"
          git push
