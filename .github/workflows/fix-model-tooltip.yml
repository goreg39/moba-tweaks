name: Fix model match and waiting tooltip

on:
  push:
    paths:
      - '.github/workflows/fix-model-tooltip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch userscript
        run: python tools/patch_v0151.py

      - name: Verify userscript
        run: |
          node --check moba-tweaks.user.js
          grep -F '// @version      0.15.1' moba-tweaks.user.js
          grep -F "list.dataset.mobaGroupedVersion = '0.15.1';" moba-tweaks.user.js
          grep -F "function suppressWaitingTooltip(node)" moba-tweaks.user.js
          grep -F "var queryCore = queryTokens.slice(modelIndex);" moba-tweaks.user.js

      - name: Commit userscript and cleanup
        run: |
          rm -f .github/workflows/fix-model-tooltip.yml tools/patch_v0151.py
          git config user.name "goreg39"
          git config user.email "53629617+goreg39@users.noreply.github.com"
          git add moba-tweaks.user.js .github/workflows/fix-model-tooltip.yml tools/patch_v0151.py
          git commit -m "Fix waiting tooltip and multi-model compatibility match"
          git push
