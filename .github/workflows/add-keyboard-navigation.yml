name: Add keyboard navigation

on:
  push:
    paths:
      - '.github/workflows/add-keyboard-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch userscript
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Verify userscript
        shell: bash
        run: |
          node --check moba-tweaks.user.js
          grep -F '// @version      0.13.0' moba-tweaks.user.js
          grep -F "list.dataset.mobaGroupedVersion = '0.13.0';" moba-tweaks.user.js
          grep -F "event.key === 'ArrowDown'" moba-tweaks.user.js
          grep -F "event.key === 'ArrowUp'" moba-tweaks.user.js
          grep -F "openSelectedProduct(event.shiftKey)" moba-tweaks.user.js

      - name: Commit userscript and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-keyboard-navigation.yml
          git config user.name "goreg39"
          git config user.email "53629617+goreg39@users.noreply.github.com"
          git add moba-tweaks.user.js .github/workflows/add-keyboard-navigation.yml
          git commit -m "Add keyboard product navigation"
          git push
