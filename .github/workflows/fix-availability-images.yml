name: Fix availability and full-size images

on:
  push:
    paths:
      - '.github/workflows/fix-availability-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch userscript
        run: python tools/patch_v015.py

      - name: Verify userscript
        run: |
          node --check moba-tweaks.user.js
          grep -F '// @version      0.15.0' moba-tweaks.user.js
          grep -F "return 'other-store';" moba-tweaks.user.js
          grep -F "isVisibleStockNode" moba-tweaks.user.js
          grep -F "fetch(productUrl, { credentials: 'same-origin' })" moba-tweaks.user.js
          grep -F "openImageModal(sourceImg, imageLink.href || '')" moba-tweaks.user.js
          grep -F "moba-image-modal--zoomed" moba-tweaks.user.js

      - name: Commit userscript and cleanup
        run: |
          rm -f .github/workflows/fix-availability-images.yml tools/patch_v015.py
          git config user.name "goreg39"
          git config user.email "53629617+goreg39@users.noreply.github.com"
          git add moba-tweaks.user.js .github/workflows/fix-availability-images.yml tools/patch_v015.py
          git commit -m "Fix store availability and load full-size product images"
          git push
